<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AdaFace tinygrad WebGPU</title>
    <script type="module">
        import ADAFACE from "./net.js";
        window.ADAFACE = ADAFACE;
    </script>
    <style>
        body {
            margin: 0;
            background: #050505;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding-top: 20px;
            height: 100vh;
            position: relative;
            overflow: hidden;
            color: #eee;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        #video, #overlay {
            position: absolute;
            top: 45%;
            left: 50%;
            transform: translate(-50%, -50%) scaleX(-1);
            max-width: 100vw;
            max-height: 100vh;
        }
        #overlay { pointer-events: none; }
        #outputContainer {
            position: absolute;
            bottom: 80px;
            left: 20px;
            background: rgba(0,0,0,0.8);
            border: 1px solid lime;
            color: lime;
            font-family: monospace;
            padding: 10px;
            font-size: 14px;
            z-index: 5;
            max-height: 300px;
            overflow-y: auto;
            min-width: 220px;
        }
        .face-thumb {
            display: inline-block;
            margin: 4px;
            text-align: center;
            vertical-align: top;
            background: #1a1a1a;
            padding: 4px;
            border-radius: 4px;
            border: 1px solid #333;
        }
        .face-thumb canvas {
            display: block;
            margin-bottom: 2px;
            border: 1px solid #555;
        }
        .face-thumb span {
            font-size: 10px;
            color: #ccc;
        }
        #setupUI {
            position: absolute;
            z-index: 100;
            background: #111;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            gap: 10px;
            padding-top: 80px;
        }
        .controls {
            display: flex;
            gap: 6px;
            align-items: center;
            flex-wrap: wrap;
            justify-content: center;
        }
        #cropCanvas {
            border: 2px solid #444;
            cursor: crosshair;
            background: #000;
            max-width: 90vw;
            max-height: 60vh;
            touch-action: none;
        }
        button {
            padding: 6px 10px;
            font-size: 12px;
            background: #333;
            color: white;
            border: 1px solid #555;
            cursor: pointer;
            border-radius: 4px;
        }
        button:hover { background: #444; }
        #snapBtn { background: #552200; border-color: #aa4400; }
        #setEmbBtn {
            background: #004400;
            border-color: lime;
            color: lime;
            font-weight: bold;
        }
        #setEmbBtn:disabled { opacity: 0.3; cursor: not-allowed; }
        input[type="file"] {
            font-size: 11px;
            color: #888;
            max-width: 120px;
        }
        #multiStatus {
            font-size: 11px;
            color: #0f0;
            margin: 5px 0;
            text-align: center;
        }
        .face-list {
            margin-top: 8px;
            border-top: 1px solid #333;
            padding-top: 5px;
        }
        .current-sim {
            font-weight: bold;
        }

        @media (max-width: 600px) {
            #outputContainer {
                bottom: auto;
                top: 70px;
                left: 10px;
                right: 10px;
                min-width: unset;
                max-height: 200px;
                font-size: 12px;
            }
            #video, #overlay {
                top: 250px;
                transform: translate(-50%, 0) scaleX(-1); /* remove vertical centering */
            }
        }
    </style>
</head>
<body>
<div style="position:absolute; top:0; left:0; width:100%; padding:15px; background:#111; text-align:center; font-size:1.2rem; font-weight:bold; z-index:9999; box-sizing:border-box;"><a href="https://github.com/roryclear/adaface-tinygrad" style="color:inherit; text-decoration:none; display:block;">AdaFace tinygrad WebGPU</a></div>
<div id="setupUI">
    <canvas id="cropCanvas"></canvas>

    <div class="controls">
        <button id="snapBtn">Capture</button>
        <input type="file" id="fileInput" accept="image/*" multiple>
        <button id="setEmbBtn" disabled>Add Face</button>
    </div>

    <div id="multiStatus">Upload images or take face photo.</div>
</div>

<video id="video" autoplay muted playsinline></video>
<canvas id="overlay"></canvas>

<div id="outputContainer">
    <canvas id="thumb" width="60" height="60"
    style="display:block;margin-bottom:6px;border:1px solid lime;"></canvas>
    <div id="output"></div>
    <div class="face-list">
        <div id="faceGallery" style="max-height:180px; overflow-y:auto;"></div>
    </div>
    <div id="fpsCounter" style="position:absolute; bottom:5px; right:5px; background:#000; color:#0f0; font-family:monospace; font-size:11px; padding:2px 6px; border-radius:3px;">FPS: --</div>
</div>

<script>
let modelLoadingPromise = null;
const INPUT_SIZE = 112;
let net = null;
let embeddings = [];
let setupStream = null;
let isDragging = false;
let isUsingLiveFeed = false;
let uploadedImg = new Image();
let cropRect = { x: 0, y: 0, w: 0, h: 0 };
let currentUploadedFileIndex = -1;
let pendingFiles = [];
let isLoadingModel = false;

const video = document.getElementById('video');
const overlay = document.getElementById('overlay');
const overlayCtx = overlay.getContext('2d');
const outputEl = document.getElementById('output');
const setupUI = document.getElementById('setupUI');
const cropCanvas = document.getElementById('cropCanvas');
const ctxCrop = cropCanvas.getContext('2d');
const fileInput = document.getElementById('fileInput');
const setEmbBtn = document.getElementById('setEmbBtn');
const snapBtn = document.getElementById('snapBtn');
const faceGalleryDiv = document.getElementById('faceGallery');

const offscreenCanvas = document.createElement('canvas');
offscreenCanvas.width = INPUT_SIZE;
offscreenCanvas.height = INPUT_SIZE;
const offscreenCtx = offscreenCanvas.getContext('2d');
const thumbCtx = document.getElementById('thumb').getContext('2d');

window.onload = async () => {
    try {
        setupStream = await navigator.mediaDevices.getUserMedia({ video: true });
        video.srcObject = setupStream;
        outputEl.textContent = "Ready. Upload images or capture.";
        startPreviewLoop();
        isUsingLiveFeed = false;
        loadModelOnLaunch();
    } catch (e) {
        outputEl.textContent = "Error: Camera access denied.";
        alert("Please allow camera access.");
    }
};

function loadModelOnLaunch() {
    if (modelLoadingPromise) return modelLoadingPromise;
    modelLoadingPromise = (async () => {
        const url = "https://huggingface.co/roryclear/AdaFace/resolve/main/adaface_ir50_ms1mv2.safetensors";
        try {
            const res = await fetch(url);
            const contentLength = res.headers.get("Content-Length");
            const total = contentLength ? parseInt(contentLength, 10) : 0;
            const reader = res.body.getReader();
            let received = 0;
            const chunks = [];
            while (true) {
                const { done, value } = await reader.read();
                if (done) break;
                chunks.push(value);
                received += value.length;
                const percent = Math.round((received / total) * 100);
                setEmbBtn.textContent = `Loading model ${percent}%`;
            }
            const blob = new Blob(chunks);
            const blobUrl = URL.createObjectURL(blob);
            const device = await getDevice();
            net = await ADAFACE.load(device, blobUrl);
            URL.revokeObjectURL(blobUrl);
            setEmbBtn.textContent = "Add Face";
        } catch(err) {
            alert(err.message);
            console.error(err);
            setEmbBtn.textContent = "Add Face";
            throw err;
        }
    })();
    
    return modelLoadingPromise;
}

function startPreviewLoop() {
    const preview = () => {
        if (video.videoWidth > 0 && !isUsingLiveFeed && !uploadedImg.src) {
            cropCanvas.width = video.videoWidth;
            cropCanvas.height = video.videoHeight;
            ctxCrop.save();
            ctxCrop.scale(-1, 1);
            ctxCrop.drawImage(video, -cropCanvas.width, 0);
            ctxCrop.restore();
        }
        requestAnimationFrame(preview);
    };
    preview();
}

fileInput.onchange = async (e) => {

    const files = Array.from(e.target.files);
    if (files.length === 0) return;
    pendingFiles.push(...files);
    if (currentUploadedFileIndex === -1 || currentUploadedFileIndex >= pendingFiles.length - files.length) {
        currentUploadedFileIndex = pendingFiles.length - files.length;
        loadFileByIndex(currentUploadedFileIndex);
    }

    multiStatus.innerText = `Added ${files.length} images. Total: ${pendingFiles.length}. Crop and click 'Add Face'.`;

    isUsingLiveFeed = false;
    multiStatus.innerText = `Loaded ${files.length} images. Crop face on each and click 'Add Face'.`;
    loadNextFileForCrop();
};

function loadNextFileForCrop() {
    if (currentUploadedFileIndex >= pendingFiles.length) {
        multiStatus.innerText = `All ${pendingFiles.length} images processed. You can upload more or start recognition.`;
        setEmbBtn.disabled = true;
        cropRect = { x: 0, y: 0, w: 0, h: 0 };
        ctxCrop.clearRect(0, 0, cropCanvas.width, cropCanvas.height);
        if (pendingFiles.length > 0) {
            multiStatus.innerText += " Click 'Clear All' to reset gallery.";
        }
        return;
    }
    const file = pendingFiles[currentUploadedFileIndex];
    const reader = new FileReader();
    reader.onload = (event) => {
        uploadedImg.onload = () => {
            cropCanvas.width = uploadedImg.width;
            cropCanvas.height = uploadedImg.height;
            ctxCrop.drawImage(uploadedImg, 0, 0);
            initCropSquare();
            multiStatus.innerText = `Image ${currentUploadedFileIndex+1}/${pendingFiles.length}: Move and resize square around face (eyes where dots are), then click 'Add Face'`;
        };
        uploadedImg.src = event.target.result;
    };
    reader.readAsDataURL(file);
}

snapBtn.onclick = () => {
    if (!video.videoWidth) return;
    const captureCanvas = document.createElement('canvas');
    captureCanvas.width = video.videoWidth;
    captureCanvas.height = video.videoHeight;
    const capCtx = captureCanvas.getContext('2d');
    capCtx.save();
    capCtx.scale(-1, 1);
    capCtx.drawImage(video, -captureCanvas.width, 0);
    capCtx.restore();
    captureCanvas.toBlob(blob => {
        const capturedFile = new File([blob], `snap_${Date.now()}.jpg`, { type: 'image/jpeg' });
        if (currentUploadedFileIndex >= 0 && currentUploadedFileIndex < pendingFiles.length) {
            pendingFiles.splice(currentUploadedFileIndex + 1, 0, capturedFile);
            multiStatus.innerText = `Snapshot added. ${pendingFiles.length} total images. Click 'Add Face' after cropping.`;
        } else {
            pendingFiles.push(capturedFile);
            if (currentUploadedFileIndex === -1 || currentUploadedFileIndex >= pendingFiles.length - 1) {
                currentUploadedFileIndex = pendingFiles.length - 1;
                loadFileByIndex(currentUploadedFileIndex);
            }
            multiStatus.innerText = `Snapshot added. Total ${pendingFiles.length} images.`;
        }
        fileInput.value = '';
        loadNextFileForCrop();
    }, 'image/jpeg');
};

function loadFileByIndex(index) {
    if (index >= pendingFiles.length) return;
    const file = pendingFiles[index];
    const reader = new FileReader();
    reader.onload = (event) => {
        uploadedImg.onload = () => {
            cropCanvas.width = uploadedImg.width;
            cropCanvas.height = uploadedImg.height;
            ctxCrop.drawImage(uploadedImg, 0, 0);
            initCropSquare();
            multiStatus.innerText = `Image ${index+1}/${pendingFiles.length}: Move and resize square around face (eyes where dots are), then click 'Add Face'`;
        };
        uploadedImg.src = event.target.result;
    };
    reader.readAsDataURL(file);
}

function getCanvasCoords(e) {
    const rect = cropCanvas.getBoundingClientRect();
    let clientX = e.touches ? e.touches[0].clientX : e.clientX;
    let clientY = e.touches ? e.touches[0].clientY : e.clientY;

    return {
        x: (clientX - rect.left) * (cropCanvas.width / rect.width),
        y: (clientY - rect.top) * (cropCanvas.height / rect.height)
    };
}

let dragOffset = { x: 0, y: 0 };
let initialPinchDistance = null;
let initialSize = null;

function drawCrop() {
    ctxCrop.clearRect(0, 0, cropCanvas.width, cropCanvas.height);
    ctxCrop.drawImage(uploadedImg, 0, 0);
    ctxCrop.strokeStyle = 'cyan';
    ctxCrop.lineWidth = Math.max(3, cropCanvas.width * 0.005);
    ctxCrop.strokeRect(cropRect.x, cropRect.y, cropRect.w, cropRect.h);
    const size = 12;
    ctxCrop.fillStyle = 'cyan';
    ctxCrop.fillRect(
        cropRect.x + cropRect.w - size,
        cropRect.y + cropRect.h - size,
        size,
        size
    );
    const dotRadius = Math.max(4, cropCanvas.width * 0.006);
    const dotY = cropRect.y + cropRect.h * 0.455;
    const dot1X = cropRect.x + cropRect.w * 0.34;
    const dot2X = cropRect.x + cropRect.w * 0.65;
    ctxCrop.fillStyle = 'cyan';
    ctxCrop.beginPath();
    ctxCrop.arc(dot1X, dotY, dotRadius, 0, Math.PI * 2);
    ctxCrop.fill();
    ctxCrop.beginPath();
    ctxCrop.arc(dot2X, dotY, dotRadius, 0, Math.PI * 2);
    ctxCrop.fill();
}

let isResizing = false;

function isInResizeCorner(pos) {
    const size = 16;
    return (
        pos.x > cropRect.x + cropRect.w - size &&
        pos.y > cropRect.y + cropRect.h - size
    );
}

function initCropSquare() {
    const size = Math.min(cropCanvas.width, cropCanvas.height) * 0.4;

    cropRect = {
        x: (cropCanvas.width - size) / 2,
        y: (cropCanvas.height - size) / 2,
        w: size,
        h: size
    };

    setEmbBtn.disabled = false;
    drawCrop();
}

function clampCrop() {
    cropRect.x = Math.max(0, Math.min(cropRect.x, cropCanvas.width - cropRect.w));
    cropRect.y = Math.max(0, Math.min(cropRect.y, cropCanvas.height - cropRect.h));
}

// DRAG MOVE
function startMove(e) {
    if (!uploadedImg.src) return;

    const pos = getCanvasCoords(e);

    if (isInResizeCorner(pos)) {
        isResizing = true;
        return;
    }

    dragOffset.x = pos.x - cropRect.x;
    dragOffset.y = pos.y - cropRect.y;
    isDragging = true;
}

cropCanvas.addEventListener('mousedown', startMove);
cropCanvas.addEventListener('mousemove', moveSquare);
cropCanvas.addEventListener('mouseup', endMove);

cropCanvas.addEventListener('touchstart', (e) => {
    if (e.touches.length === 1) startMove(e);
}, { passive: false });

cropCanvas.addEventListener('touchmove', (e) => {
    if (e.touches.length === 1) moveSquare(e);
    else if (e.touches.length === 2) handlePinch(e);
}, { passive: false });

cropCanvas.addEventListener('touchend', () => {
    endMove();
    endPinch();
});

function moveSquare(e) {
    const pos = getCanvasCoords(e);
    if (isResizing) {
        let newSize = pos.x - cropRect.x;
        newSize = Math.max(40, newSize);

        cropRect.w = newSize;
        cropRect.h = newSize;

        clampCrop();
        drawCrop();
        return;
    }

    // MOVE
    if (!isDragging || e.touches?.length === 2) return;

    cropRect.x = pos.x - dragOffset.x;
    cropRect.y = pos.y - dragOffset.y;

    clampCrop();
    drawCrop();
}

function endMove() {
    isDragging = false;
    isResizing = false;
}

// PINCH RESIZE
function getTouchDistance(touches) {
    const dx = touches[0].clientX - touches[1].clientX;
    const dy = touches[0].clientY - touches[1].clientY;
    return Math.sqrt(dx * dx + dy * dy);
}

function handlePinch(e) {
    if (e.touches.length !== 2) return;

    e.preventDefault();

    const dist = getTouchDistance(e.touches);

    if (!initialPinchDistance) {
        initialPinchDistance = dist;
        initialSize = cropRect.w;
        return;
    }

    const scale = dist / initialPinchDistance;
    let newSize = Math.max(40, initialSize * scale);

    const cx = cropRect.x + cropRect.w / 2;
    const cy = cropRect.y + cropRect.h / 2;

    cropRect.w = newSize;
    cropRect.h = newSize;
    cropRect.x = cx - newSize / 2;
    cropRect.y = cy - newSize / 2;

    clampCrop();
    drawCrop();
}

function endPinch() {
    initialPinchDistance = null;
}

setEmbBtn.onclick = async () => {
    if (!uploadedImg.src) return;
    if (Math.abs(cropRect.w) < 10) return;
    setEmbBtn.disabled = true;
    
    if (!net) {
        if (modelLoadingPromise) {
            multiStatus.innerText = "Waiting for model to load...";
            await modelLoadingPromise;
        } else {
            await loadModelOnLaunch();
        }
    }
    
    const realX = cropRect.w < 0 ? cropRect.x + cropRect.w : cropRect.x;
    const realY = cropRect.h < 0 ? cropRect.y + cropRect.h : cropRect.y;
    const side = Math.abs(cropRect.w);
    if (side < 8) {
        setEmbBtn.disabled = false;
        return;
    }
    
    const thumbCanvas = document.createElement('canvas');
    thumbCanvas.width = 50;
    thumbCanvas.height = 50;
    const thumbCtxLocal = thumbCanvas.getContext('2d');
    thumbCtxLocal.drawImage(uploadedImg, realX, realY, side, side, 0, 0, 50, 50);
    const thumbDataUrl = thumbCanvas.toDataURL();
    
    offscreenCtx.clearRect(0, 0, INPUT_SIZE, INPUT_SIZE);
    offscreenCtx.drawImage(uploadedImg, realX, realY, side, side, 0, 0, INPUT_SIZE, INPUT_SIZE);
    const input = getInputTensor(offscreenCtx);
    
    setEmbBtn.textContent = "Computing...";
    const out = await net(input);
    const embedding = new Float32Array(out[0]);
    
    embeddings.push({
        emb: embedding,
        thumbDataUrl: thumbDataUrl,
        cropRectInfo: { x: realX, y: realY, side: side }
    });
    updateGallery();
    
    if (currentUploadedFileIndex < pendingFiles.length - 1) {
        currentUploadedFileIndex++;
        loadFileByIndex(currentUploadedFileIndex);
        multiStatus.innerText = `Added, next image ${currentUploadedFileIndex+1}/${pendingFiles.length}`;
        initCropSquare();
    } else if (currentUploadedFileIndex === pendingFiles.length - 1) {
        multiStatus.innerText = `added face from last image. Faces: ${embeddings.length}.`;
        setEmbBtn.disabled = true;
        if (setupStream) {
            setupStream.getTracks().forEach(t => t.stop());
        }
        setupUI.style.display = 'none';
        const runStream = await navigator.mediaDevices.getUserMedia({ video: true });
        video.srcObject = runStream;
        requestAnimationFrame(processFrame);
    } else {
        setEmbBtn.disabled = true;
        multiStatus.innerText = `Face added. Total: ${embeddings.length}`;
    }
    setEmbBtn.textContent = "Add Face";
};

function updateGallery() {
    faceGalleryDiv.innerHTML = '';
    for (let idx = 0; idx < embeddings.length; idx++) {
        const item = embeddings[idx];
        const div = document.createElement('div');
        div.className = 'face-thumb';
        const canvas = document.createElement('canvas');
        canvas.width = 45;
        canvas.height = 45;
        const ctx = canvas.getContext('2d');
        const img = new Image();
        img.onload = () => {
            ctx.drawImage(img, 0, 0, 45, 45);
        };
        img.src = item.thumbDataUrl;
        
        const percentSpan = document.createElement('span');
        percentSpan.className = 'sim-percent';
        percentSpan.textContent = '--%';
        percentSpan.style.fontSize = '10px';
        percentSpan.style.display = 'block';
        percentSpan.style.fontWeight = 'bold';
        percentSpan.style.marginTop = '2px';
        percentSpan.style.color = '#ccc'; // Default gray
        
        div.appendChild(canvas);
        div.appendChild(percentSpan);
        faceGalleryDiv.appendChild(div);
    }
}

async function processFrame() {
    const now = performance.now();
    if (!window._lastFPS) window._lastFPS = now;
    window._frameCount = (window._frameCount || 0) + 1;
    if (now - window._lastFPS >= 1000) {
        document.getElementById('fpsCounter').innerText = `FPS: ${window._frameCount}`;
        window._frameCount = 0;
        window._lastFPS = now;
    }

    if (!video.videoWidth || video.videoWidth === 0) {
        requestAnimationFrame(processFrame);
        return;
    }
    if (!net || embeddings.length === 0) {
        overlay.width = video.clientWidth;
        overlay.height = video.clientHeight;
        overlayCtx.clearRect(0, 0, overlay.width, overlay.height);
        overlayCtx.font = "16px monospace";
        overlayCtx.fillStyle = "yellow";
        overlayCtx.shadowBlur = 0;
        overlayCtx.fillText("No Faces. Add faces via upload.", 20, 40);
        requestAnimationFrame(processFrame);
        return;
    }
    
    overlay.width = video.clientWidth;
    overlay.height = video.clientHeight;
    overlayCtx.clearRect(0, 0, overlay.width, overlay.height);
    
    const squareSize = Math.min(overlay.width, overlay.height) * 0.5;
    const squareX = (overlay.width - squareSize) / 2;
    const squareY = (overlay.height - squareSize) / 2;
    overlayCtx.strokeStyle = 'cyan';
    overlayCtx.lineWidth = 2;
    overlayCtx.strokeRect(squareX, squareY, squareSize, squareSize);
    
    // === DRAW EYE GUIDES (same ratios as crop UI) ===
    const dotRadius = Math.max(4, squareSize * 0.02);

    // same relative positions as setup
    const dotY = squareY + squareSize * 0.455;
    const dot1X = squareX + squareSize * 0.34;
    const dot2X = squareX + squareSize * 0.65;

    overlayCtx.fillStyle = 'cyan';

    // left eye
    overlayCtx.beginPath();
    overlayCtx.arc(dot1X, dotY, dotRadius, 0, Math.PI * 2);
    overlayCtx.fill();

    // right eye
    overlayCtx.beginPath();
    overlayCtx.arc(dot2X, dotY, dotRadius, 0, Math.PI * 2);
    overlayCtx.fill();

    const vw = video.videoWidth;
    const vh = video.videoHeight;
    const cropSize = Math.min(vw, vh) * 0.5;
    const sx = (vw - cropSize) / 2;
    const sy = (vh - cropSize) / 2;
    
    offscreenCtx.drawImage(video, sx, sy, cropSize, cropSize, 0, 0, INPUT_SIZE, INPUT_SIZE);
    const input = getInputTensor(offscreenCtx);
    const out = await net(input);
    const queryEmb = out[0];
    
    const similarities = [];
    for (let i = 0; i < embeddings.length; i++) {
        let sim = 0;
        const faceEmb = embeddings[i].emb;
        for (let j = 0; j < queryEmb.length; j++) sim += faceEmb[j] * queryEmb[j];
        similarities.push(sim);
    }
    
    let bestSim = -1;
    let bestIdx = 0;
    for (let i = 0; i < similarities.length; i++) {
        if (similarities[i] > bestSim) {
            bestSim = similarities[i];
            bestIdx = i;
        }
    }
    if (bestSim < 0) bestSim = 0;
    const bestPercent = Math.min(99, Math.round(bestSim * 100));
    
    const galleryItems = document.querySelectorAll('.face-thumb');
    for (let i = 0; i < galleryItems.length && i < similarities.length; i++) {
        const sim = similarities[i];
        const percent = Math.min(99, Math.max(0, Math.round(sim * 100)));
        let percentSpan = galleryItems[i].querySelector('.sim-percent');
        
        // Create span if it doesn't exist
        if (!percentSpan) {
            percentSpan = document.createElement('span');
            percentSpan.className = 'sim-percent';
            percentSpan.style.fontSize = '10px';
            percentSpan.style.display = 'block';
            percentSpan.style.fontWeight = 'bold';
            percentSpan.style.marginTop = '2px';
            galleryItems[i].appendChild(percentSpan);
        }
        
        // Update text
        percentSpan.textContent = `${percent}%`;
        
        // Force color update by directly setting style (with !important to override any lingering styles)
        if (percent >= 60) {
            percentSpan.style.setProperty('color', '#0f0', 'important');
        } else if (percent >= 30) {
            percentSpan.style.setProperty('color', '#fa0', 'important');
        } else {
            percentSpan.style.setProperty('color', '#f44', 'important');
        }
    }

    outputEl.textContent = `Best match: ${bestPercent}%`;
    outputEl.innerHTML = `Best match: ${bestPercent}%`;
    if (bestPercent >= 60) {
        outputEl.style.setProperty('color', 'lime', 'important');
    } else if (bestPercent >= 30) {
        outputEl.style.setProperty('color', '#ffaa44', 'important');
    } else {
        outputEl.style.setProperty('color', '#ff4444', 'important');
    }

    if (bestSim > 0.2 && embeddings.length > 0) {
        const bestThumb = new Image();
        bestThumb.src = embeddings[bestIdx].thumbDataUrl;
        thumbCtx.drawImage(bestThumb, 0, 0, 60, 60);
    } else {
        thumbCtx.fillStyle = "#222";
        thumbCtx.fillRect(0,0,60,60);
        thumbCtx.fillStyle = "gray";
        thumbCtx.font = "10px monospace";
        thumbCtx.fillText("?", 25, 30);
    }
    
    requestAnimationFrame(processFrame);
}


function getInputTensor(ctx) {
    const imgData = ctx.getImageData(0, 0, INPUT_SIZE, INPUT_SIZE);
    const pixels = imgData.data;
    const input = new Float32Array(INPUT_SIZE * INPUT_SIZE * 3);
    let j = 0;
    for (let i = 0; i < pixels.length; i += 4) {
        input[j++] = pixels[i + 2];
        input[j++] = pixels[i + 1];
        input[j++] = pixels[i];
    }
    return input;
}

async function getDevice() {
    const adapter = await navigator.gpu.requestAdapter();
    return await adapter.requestDevice();
}

window.loadNextManually = function() {
    if (currentUploadedFileIndex + 1 < pendingFiles.length) {
        currentUploadedFileIndex++;
        loadFileByIndex(currentUploadedFileIndex);
    }
};
</script>
